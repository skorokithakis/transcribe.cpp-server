services:
  main:
    build: .
    restart: unless-stopped
    # The server has no authentication, so it is published on the loopback
    # interface only. Set PUBLISH_ADDR to expose it somewhere else.
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1:8000}:8000"
    # Listed without values, so an unset variable is omitted and the defaults
    # in transcribe.py apply.
    environment:
      - IDLE_TIMEOUT
      - CLOUD_BASE_URL
      - CLOUD_MODEL
      - CLOUD_API_KEY
      - LLM_BASE_URL
      - LLM_MODEL
      - LLM_API_KEY
      - MODEL_REPO
      - MODEL_FILE
    volumes:
      - cache-models:/models

volumes:
  # HF_HOME is /models in the image. The name starts with "cache-" because the
  # model is a reproducible download, so Harbormaster keeps it under caches/.
  cache-models:
